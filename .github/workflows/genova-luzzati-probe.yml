name: Giardini Luzzati bounded probe

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fixed read-only source target to verify
        required: true
        default: event
        type: choice
        options:
          - event
          - index
  push:
    branches:
      - probe/giardini-luzzati-index-once-20261006

permissions:
  contents: read

jobs:
  probe-event:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'event' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check robots.txt and probe one event
        run: python scripts/probe_giardini_luzzati.py

  probe-index:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'index') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check robots.txt and probe the candidate event index
        run: python scripts/probe_giardini_luzzati_index.py
