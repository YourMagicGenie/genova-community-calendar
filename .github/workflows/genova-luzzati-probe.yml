name: Giardini Luzzati one-event probe

on:
  workflow_dispatch:
  push:
    branches:
      - probe/giardini-luzzati-once-20261006

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check robots.txt and probe one event
        run: python scripts/probe_giardini_luzzati.py
