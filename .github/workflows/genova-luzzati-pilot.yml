name: Run manual Giardini Luzzati pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genova-luzzati-manual-pilot
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: genova-supabase-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: eginljyhnnczeeqxwfia
    steps:
      - name: Check out current main without persistent GitHub credentials
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Require existing Supabase credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link the fixed Genova project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Show hosted migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Require the hosted Issue 51 persistence boundary
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGOPTIONS: -c default_transaction_read_only=on
        shell: bash
        run: |
          test -s supabase/.temp/pooler-url || {
            echo "Supabase link did not cache the IPv4 pooler URL. Stop before contacting the source."
            exit 1
          }
          state="$(psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --field-separator='|' \
            "$(cat supabase/.temp/pooler-url)" \
            --command "SELECT
              to_regclass('public.genova_event_facts') IS NOT NULL,
              to_regclass('public.genova_source_scans') IS NOT NULL,
              EXISTS (
                SELECT 1 FROM public.feeds
                WHERE city='genova'
                  AND url='https://www.spazio-comune.org/categoria-prodotto/eventi/'
                  AND status='active'
                  AND feed_type='web_index'
              );")"
          test "$state" = "t|t|t" || {
            echo "Hosted Issue #51 schema/source approval is not ready. Stop before contacting the source."
            exit 1
          }

          source_json="$(psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            "$(cat supabase/.temp/pooler-url)" \
            --command "SELECT json_build_object(
              'id', id,
              'city', city,
              'url', url,
              'name', name,
              'status', status,
              'feed_type', feed_type,
              'publisher_url', publisher_url,
              'discovery_method', discovery_method
            )
            FROM public.feeds
            WHERE city='genova'
              AND url='https://www.spazio-comune.org/categoria-prodotto/eventi/'
              AND status='active'
              AND feed_type='web_index'
            LIMIT 1;")"
          test -n "$source_json" || {
            echo "Approved Luzzati source snapshot is empty. Stop before contacting the source."
            exit 1
          }
          printf '%s\n' "$source_json" > "$RUNNER_TEMP/luzzati-source.json"

      - name: Collect one bounded index report
        run: |
          python scripts/collect_genova_luzzati.py \
            --source "$RUNNER_TEMP/luzzati-source.json" \
            --output "$RUNNER_TEMP/luzzati-report.json"

      - name: Validate report and render transactional persistence SQL
        run: |
          python scripts/persist_genova_luzzati_report.py             --report "$RUNNER_TEMP/luzzati-report.json"             --revision "$GITHUB_SHA"             --output "$RUNNER_TEMP/luzzati-persist.sql"

      - name: Persist reviewable facts and private scan provenance
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -s supabase/.temp/pooler-url || { echo "Missing linked IPv4 pooler URL."; exit 1; }
          psql --no-psqlrc --set=ON_ERROR_STOP=1             --file "$RUNNER_TEMP/luzzati-persist.sql"             "$(cat supabase/.temp/pooler-url)"

      - name: Inspect safe pilot counts
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align             "$(cat supabase/.temp/pooler-url)" <<'SQL'
          SELECT json_build_object(
            'reviewable_facts', count(*),
            'needs_review', count(*) FILTER (WHERE review_status = 'needs_review'),
            'published', count(*) FILTER (WHERE review_status = 'published')
          )
          FROM public.genova_event_facts;

          SELECT json_build_object(
            'outcome', outcome,
            'request_count', request_count,
            'events_found', events_found,
            'robots_decision', robots_decision,
            'page_http_status', page_http_status
          )
          FROM public.genova_source_scans
          ORDER BY started_at DESC
          LIMIT 1;
          SQL
