# The upstream multi-city publisher was retired in issue #10. This workflow
# performs a read-only scope check until the Genova collector is implemented.
name: Genova collection dry run

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "The only supported scope is genova"
        required: true
        default: genova

jobs:
  scope-dry-run:
    runs-on: ubuntu-latest
    env:
      REQUESTED_SCOPE: ${{ inputs.scope }}
      ENABLED_CITIES: ${{ vars.ENABLED_CITIES }}
    steps:
      - uses: actions/checkout@v6
      - name: Show safe collection plan
        run: python scripts/plan_genova_collection.py --scope "$REQUESTED_SCOPE" --enabled-cities "$ENABLED_CITIES"
