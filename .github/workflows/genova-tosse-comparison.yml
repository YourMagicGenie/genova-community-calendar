name: Genova Tosse bounded comparison
on:
  workflow_dispatch:
    inputs:
      detail_limit:
        description: 'Sequential detail-page cap (1–3)'
        default: '2'
        required: true
        type: choice
        options: ['1', '2', '3']
      sample_only:
        description: 'Use known detail URLs without contacting the index'
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: genova-tosse-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect temporary facts only
        env:
          DETAIL_LIMIT: ${{ inputs.detail_limit }}
          SAMPLE_ONLY: ${{ inputs.sample_only }}
        run: |
          args=()
          if [ "$SAMPLE_ONLY" = "true" ]; then args+=(--sample-only); fi
          python scripts/collect_genova_tosse.py --detail-limit "$DETAIL_LIMIT" "${args[@]}" --output tosse-comparison.json
      - name: Upload temporary comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genova-tosse-facts-comparison
          path: tosse-comparison.json
          retention-days: 1
          if-no-files-found: ignore
