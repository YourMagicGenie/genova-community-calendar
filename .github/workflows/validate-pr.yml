name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  validate-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for diff

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Audit known Python vulnerabilities
        run: pip-audit -r requirements-dev.txt

      - name: Validate feed/scraper consistency
        run: python scripts/validate_pr_feeds.py --base-ref origin/${{ github.base_ref }}

      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py

      - name: Run offline ICS fixture pipeline
        run: pytest tests/test_timezone_pipeline.py::TestRealIcsFiles -v

      - name: Run Python tests
        run: pytest tests/ -v

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations to local database
        run: supabase db reset

      - name: Run database tests
        run: supabase test db supabase/tests/

  perf-gate:
    # Guards the collapseLongRunningEvents content-key cache (issue #77) so a
    # regression fails here in the PR instead of after a fork has merged it.
    # Adopted from the B-Square fork's ADR 0004 verification protocol.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify collapse-cache regression gate
        run: node scripts/bench_collapse_long.js

      - name: Run Genova sample preview tests
        run: node --test tests/sample-preview.test.js

      - name: Run load-events authorization tests
        run: node --test tests/load-events-protection.test.mjs

      - name: Run fixture-only agent and admin-page tests
        run: node --test tests/genova-agent-protection.test.mjs tests/genova-admin-page.test.mjs

      - name: Test community event time conversion
        run: node --test tests/submission-time.test.mjs tests/submission-gate.test.mjs

      - name: Set up Deno for Edge Function type checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check Genova admin Edge Functions
        run: deno check supabase/functions/genova-agent-run/index.ts supabase/functions/genova-agent-callback/index.ts

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-browser.txt

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test the Genova preview in a real browser
        run: python tests/preview_browser_smoke.py

      - name: Upload browser screenshots and errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genova-preview-browser-failure
          path: browser-smoke-artifacts/
          if-no-files-found: ignore
