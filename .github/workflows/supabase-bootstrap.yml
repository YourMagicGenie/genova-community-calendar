name: Bootstrap Genova Supabase schema

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview the migration plan, or apply it to the owner-controlled Genova project
        required: true
        type: choice
        options:
          - preview
          - apply
        default: preview

permissions:
  contents: read

concurrency:
  group: genova-supabase-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: genova-supabase-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: eginljyhnnczeeqxwfia
    steps:
      - name: Check out main without a persistent GitHub token
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up the pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Check required credentials are present
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN to the genova-supabase-bootstrap environment."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Add SUPABASE_DB_PASSWORD to the genova-supabase-bootstrap environment."
            exit 1
          fi

      - name: Link the fixed Genova project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Require an IPv4 pooler connection for the runner
        shell: bash
        run: |
          if [ ! -s supabase/.temp/pooler-url ]; then
            echo "Supabase link did not obtain the IPv4 pooler URL. The scoped access token needs Connection Pooling: Read for this project; verify the pooler is available, then retry preview."
            exit 1
          fi

      - name: Show current migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Capture the read-only project state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query --linked --agent yes --output json \
            -f supabase/ops/genova_bootstrap_state.sql \
            > "$RUNNER_TEMP/genova-supabase-preflight.json"

      - name: Stop unless the exact reviewed starting state is present
        run: |
          python scripts/verify_genova_supabase_bootstrap.py \
            --stage preflight \
            --snapshot "$RUNNER_TEMP/genova-supabase-preflight.json"

      - name: Preview all pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run --linked --include-all

      - name: Apply the reviewed migrations
        if: ${{ inputs.operation == 'apply' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --include-all --yes

      - name: Show resulting migration history
        if: ${{ inputs.operation == 'apply' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Capture the resulting read-only project state
        if: ${{ inputs.operation == 'apply' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db query --linked --agent yes --output json \
            -f supabase/ops/genova_bootstrap_state.sql \
            > "$RUNNER_TEMP/genova-supabase-postflight.json"

      - name: Verify every local migration and required RLS table
        if: ${{ inputs.operation == 'apply' }}
        run: |
          python scripts/verify_genova_supabase_bootstrap.py \
            --stage postflight \
            --snapshot "$RUNNER_TEMP/genova-supabase-postflight.json"

      - name: Print Supabase Security Advisor findings for owner review
        if: ${{ inputs.operation == 'apply' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db advisors --linked --type security --level info --fail-on none
