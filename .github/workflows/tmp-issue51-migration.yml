name: Temporary Issue 51 migration filename

on:
  push:
    branches:
      - issue-51-persistence

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[migration-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - name: Generate migration with the repository CLI
        run: supabase migration new genova_first_source_persistence
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/
          git commit -m "Create Issue 51 migration [migration-generated]"
          git push
