name: Apply reviewed Oct 6 Genova migration batch

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview the two reviewed pending migrations, or apply them together
        required: true
        type: choice
        options:
          - preview
          - apply
        default: preview

permissions:
  contents: read

concurrency:
  group: genova-supabase-schema
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: genova-supabase-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: eginljyhnnczeeqxwfia
    steps:
      - name: Check out current main without persistent GitHub credentials
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Require existing Supabase credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link the fixed Genova project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Require IPv4 pooler and PostgreSQL client
        run: |
          test -s supabase/.temp/pooler-url || { echo "Missing linked IPv4 pooler URL."; exit 1; }
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Show current migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Capture read-only project state
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --quiet \
            --file supabase/ops/genova_bootstrap_state.sql \
            "$(cat supabase/.temp/pooler-url)" > "$RUNNER_TEMP/genova-batch-preflight.json"

      - name: Require exactly the reviewed Oct 6 batch pending
        run: python scripts/verify_genova_reviewed_batch.py --snapshot "$RUNNER_TEMP/genova-batch-preflight.json"

      - name: Preview both pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run --linked

      - name: Apply both reviewed migrations
        if: ${{ inputs.operation == 'apply' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

      - name: Capture resulting read-only project state
        if: ${{ inputs.operation == 'apply' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --quiet \
            --file supabase/ops/genova_bootstrap_state.sql \
            "$(cat supabase/.temp/pooler-url)" > "$RUNNER_TEMP/genova-batch-postflight.json"

      - name: Verify full migration history and core RLS
        if: ${{ inputs.operation == 'apply' }}
        run: |
          python scripts/verify_genova_single_migration.py \
            --stage postflight \
            --snapshot "$RUNNER_TEMP/genova-batch-postflight.json"

      - name: Print Security Advisor findings for review
        if: ${{ inputs.operation == 'apply' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/report_genova_supabase_advisors.py
