<!doctype html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
  var params = new URLSearchParams(window.location.search);
  var requestedCity = params.get('city');
  var hash = window.location.hash;
  var isGenova = requestedCity === null || requestedCity === 'genova';
  var destination = isGenova ? 'xmlui/genova-sample-preview.html' : 'xmlui/not-configured.html';
  if (isGenova) {
    params.set('city', 'genova');
    params.set('preview', 'sample');
  }
  var search = params.toString() ? '?' + params.toString() : '';
  window.location.replace(destination + search + hash);
</script>
</body>
</html>
